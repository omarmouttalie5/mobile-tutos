<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar + Content Layout</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Main container using flex and min-h-screen -->
    <div class="flex min-h-screen">
        
        <!-- Aside navigation with fixed width w-64 -->
        <aside class="w-64 bg-slate-800 text-white p-4">
            <h2 class="text-xl font-bold mb-6">Sidebar</h2>
            <nav class="space-y-2">
                <a href="#" class="block p-2 rounded hover:bg-slate-700">Dashboard</a>
                <a href="#" class="block p-2 rounded hover:bg-slate-700">Categories</a>
                <a href="#" class="block p-2 rounded hover:bg-slate-700">Settings</a>
            </nav>
        </aside>

        <!-- Right container using flex-1 flex flex-col -->
        <div class="flex-1 flex flex-col">
            
            <!-- Header using flex items-center justify-between -->
            <header class="flex items-center justify-between bg-white px-6 py-4 border-b">
                <h1 class="text-xl font-semibold">Dashboard</h1>
                <button class="bg-blue-600 text-white px-4 py-2 rounded">Profile</button>
            </header>

            <!-- Main area using flex-1 p-6 -->
            <main class="flex-1 p-6">
                <!-- Inner container using max-w-5xl mx-auto -->
                <div class="max-w-5xl mx-auto space-y-4">
                    <div class="bg-white p-6 rounded-lg shadow-sm">
                        <h2 class="text-lg font-bold mb-2">Main Content Header</h2>
                        <p class="text-gray-600">This area is centered with max-w-5xl and mx-auto.</p>
                    </div>
                </div>
            </main>

        </div>

    </div>

</body>
</html>
